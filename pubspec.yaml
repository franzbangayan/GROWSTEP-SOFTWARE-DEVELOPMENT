name: growstep
description: GrowStep AR — Walk, learn Flutter, earn coins.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Persistence
  sqflite: ^2.3.3          # SQLite — user accounts & game data
  path: ^1.9.0             # DB file path helper (used by sqflite)
  shared_preferences: ^2.2.2  # Session flags only (is_logged_in, current_user_id)

  # Hardware
  camera: ^0.11.0+2        # AR camera background
  pedometer: ^4.0.0        # Real step counting
  permission_handler: ^11.3.1  # ACTIVITY_RECOGNITION permission
  geolocator: ^11.0.0
  flutter_compass: ^0.8.0  

flutter:
  uses-material-design: true

  assets:
    - assets/avatars/
    - assets/images/
    - assets/oakley/
    - assets/glowie/
    - assets/bouncy/
    - assets/circuit/
